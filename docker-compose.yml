version: '3.9'

services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://irrigator:securepassword@postgres:5432/irrigation_db
      NODE_ENV: production
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api_logs:/app/logs
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: irrigator
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: irrigation_db
    ports:
      - '5433:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U irrigator -d irrigation_db']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@irrigation.local
      PGADMIN_DEFAULT_PASSWORD: pgadminpassword
    ports:
      - '5050:80'
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

volumes:
  pg_data:
  pgadmin_data:
  api_logs:
