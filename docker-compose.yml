services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://irrigator:securepassword@postgres:5432/irrigation_db
      NODE_ENV: production
      LOG_LEVEL: info
      # Cron schedules are evaluated in this time zone, e.g. TZ=Europe/Helsinki
      TZ: ${TZ:-UTC}
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - api_logs:/app/logs
    restart: unless-stopped

  # One-off job: applies migrations and loads sample data if the database is empty
  seed:
    build:
      context: .
      target: build
    command: sh -c "node_modules/.bin/prisma migrate deploy && npm run db:seed -- --if-empty"
    environment:
      DATABASE_URL: postgresql://irrigator:securepassword@postgres:5432/irrigation_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: irrigator
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: irrigation_db
    ports:
      - '5433:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U irrigator -d irrigation_db']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Optional database UI: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:8.14
    profiles: ['tools']
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@irrigation.local
      PGADMIN_DEFAULT_PASSWORD: pgadminpassword
    ports:
      - '5050:80'
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pg_data:
  pgadmin_data:
  api_logs:
